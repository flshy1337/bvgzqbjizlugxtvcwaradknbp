<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вишлист</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
  h2 { margin-top: 2.5rem; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #ddd; }
  th { font-weight: 600; }
  tbody tr:hover { background: #f6f6f6; }
  h3 { margin-top: 1.5rem; margin-bottom: .3rem; }
  p { color: #666; margin: .3rem 0 1rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #16161a; color: #eee; }
    th, td { border-color: #333; }
    tbody tr:hover { background: #202024; }
    a { color: #7db9ff; }
    p { color: #999; }
  }
</style>
</head>
<body>
<h1>Вишлист</h1>
<div id="wishlist"></div>

<script>
const cells = line => line.split('|').slice(1, -1).map(s => s.trim());
const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const cell = c => c.split('·').map(s => s.trim())
  .map(s => /^https?:\/\//.test(s) ? `<a href="${s}" target="_blank" rel="noopener">ссылка</a>` : inline(s))
  .join(' · ');

const table = md => {
  const [head, ...body] = md.trim().split('\n')
    .filter(l => l.includes('|') && !/^\s*\|[\s|:-]+\|\s*$/.test(l))
    .map(cells);
  return '<table><thead><tr>' + head.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>'
    + body.map(r => '<tr>' + r.map(c => `<td>${cell(c)}</td>`).join('') + '</tr>').join('')
    + '</tbody></table>';
};

// renders a mix of table blocks and plain-text paragraphs
const block = md => {
  let html = '', tableLines = [];
  const flush = () => { if (tableLines.length) { html += table(tableLines.join('\n')); tableLines = []; } };
  for (const line of md.split('\n')) {
    if (line.includes('|')) { tableLines.push(line); continue; }
    flush();
    const t = line.trim();
    if (t) html += `<p>${inline(t)}</p>`;
  }
  flush();
  return html;
};

fetch('wishlist.md')
  .then(r => r.text())
  .then(md => {
    const parts = md.trim().split(/^##\s+(.+)$/m);
    let html = '';
    for (let i = 1; i < parts.length; i += 2) {
      html += `<h2>${parts[i].trim()}</h2>`;
      const sub = parts[i + 1].split(/^###\s+(.+)$/m);
      html += block(sub[0]);
      for (let j = 1; j < sub.length; j += 2) {
        html += `<h3>${sub[j].trim()}</h3>` + block(sub[j + 1]);
      }
    }
    document.getElementById('wishlist').innerHTML = html;
  })
  .catch(e => document.body.append('Не смог прочитать wishlist.md: ' + e));
</script>
</body>
</html>
